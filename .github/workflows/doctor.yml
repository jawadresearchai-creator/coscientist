# Persistent CoScientist <-> GMS integration health check.
#
# Provider-specific ingestion credentials belong to the gms-data-lake repo.
# CoScientist validates only the control/data-plane contract it consumes:
# GitHub status, Drive OAuth liveness, and the GMS SQLite manifests/catalog.

name: doctor

on:
  schedule:
    - cron: "17 6 * * 1"      # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Kernel tests
        run: pytest -q

      - name: Google Drive OAuth liveness
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: coscientist doctor --live

      - name: GMS GitHub control-plane status
        env:
          GMSDL_GITHUB_REPO: ${{ vars.GMSDL_GITHUB_REPO }}
          GMSDL_GITHUB_TOKEN: ${{ secrets.GMSDL_GITHUB_TOKEN }}
        run: coscientist github-status --runs 10

      - name: GMS lake manifest/catalog health
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GMSDL_MANIFEST_FOLDER_ID: ${{ secrets.GMSDL_MANIFEST_FOLDER_ID }}
          GMSDL_GITHUB_REPO: ${{ vars.GMSDL_GITHUB_REPO }}
          GMSDL_GITHUB_TOKEN: ${{ secrets.GMSDL_GITHUB_TOKEN }}
        run: |
          coscientist lake-sync --out state/gms_lake_catalog.json
          coscientist lake-doctor --catalog state/gms_lake_catalog.json
