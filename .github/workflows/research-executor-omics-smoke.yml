name: Research CoScientist Omics Acquisition Smoke

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Opaque Research CoScientist omics job ID only"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "research_executor/omics.py"
      - "research_executor/omics_routes.json"
      - "research_executor/tests/test_omics.py"
      - ".github/workflows/research-executor-omics-smoke.yml"

permissions:
  contents: read

concurrency:
  group: research-omics-${{ github.event_name == 'workflow_dispatch' && inputs.job_id || 'COSCI-S05-OMICS-001' }}
  cancel-in-progress: false

jobs:
  omics-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COSCI_JOB_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.job_id || 'COSCI-S05-OMICS-001' }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      NXF_VER: "25.10.4"
    steps:
      - name: Checkout public executor
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zero-cost omics fallback toolchain
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pysradb==2.4.0"

          curl -fsSL https://get.nextflow.io | bash
          sudo install -m 0755 nextflow /usr/local/bin/nextflow
          rm -f nextflow

          mkdir -p "$RUNNER_TEMP/sratoolkit"
          curl -fsSL \
            https://ftp-trace.ncbi.nlm.nih.gov/sra/sdk/current/sratoolkit.current-ubuntu64.tar.gz \
            -o "$RUNNER_TEMP/sratoolkit.tar.gz"
          tar -xzf "$RUNNER_TEMP/sratoolkit.tar.gz" -C "$RUNNER_TEMP/sratoolkit"
          PREFETCH_BIN="$(find "$RUNNER_TEMP/sratoolkit" -name prefetch | head -n 1)"
          test -n "$PREFETCH_BIN"
          SRA_BIN_DIR="$(dirname "$PREFETCH_BIN")"
          test -x "$SRA_BIN_DIR/prefetch"
          test -x "$SRA_BIN_DIR/fasterq-dump"
          echo "$SRA_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SRA_BIN_DIR:$PATH"

          pysradb --version
          nextflow -version
          "$SRA_BIN_DIR/prefetch" --version
          "$SRA_BIN_DIR/fasterq-dump" --version

      - name: Live-smoke nf-core, pysradb, SRA Toolkit and GEO routes
        run: |
          set -euo pipefail

          pysradb srr-to-srp SRR9984183 > "$RUNNER_TEMP/pysradb-smoke.txt" 2>&1
          test -s "$RUNNER_TEMP/pysradb-smoke.txt"
          echo "PYSRADB_ROUTE=PASS"

          nextflow run nf-core/fetchngs -r 1.12.0 --help \
            > "$RUNNER_TEMP/fetchngs-help.txt" 2>&1
          test -s "$RUNNER_TEMP/fetchngs-help.txt"
          echo "NFCORE_FETCHNGS_ROUTE=PASS"

          python - <<'PY'
          from research_executor.omics import fetch_geo_supplementary_metadata
          fetch_geo_supplementary_metadata("GSE147507")
          print("GEO_METADATA_ROUTE=PASS")
          PY

          mkdir -p "$RUNNER_TEMP/sra-prefetch" "$RUNNER_TEMP/sra-fastq"
          prefetch ERR1160846 --max-size 100M --output-directory "$RUNNER_TEMP/sra-prefetch" \
            > "$RUNNER_TEMP/prefetch-smoke.txt" 2>&1
          SRA_OBJECT="$(find "$RUNNER_TEMP/sra-prefetch" -type f -name 'ERR1160846.sra' | head -n 1)"
          test -n "$SRA_OBJECT"
          fasterq-dump "$SRA_OBJECT" --outdir "$RUNNER_TEMP/sra-fastq" \
            > "$RUNNER_TEMP/fasterq-smoke.txt" 2>&1
          test -s "$RUNNER_TEMP/sra-fastq/ERR1160846.fastq"
          echo "SRA_TOOLKIT_ROUTE=PASS"

      - name: Run executor, Drive bridge, acquisition and omics tests
        run: >-
          python -m unittest
          research_executor.tests.test_executor
          research_executor.tests.test_drive_bridge
          research_executor.tests.test_acquisition
          research_executor.tests.test_omics
          -v

      - name: Execute private Drive omics acquisition
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          set +e
          python -m research_executor.omics \
            --job-id "$COSCI_JOB_ID" \
            --public-status out/omics-status.json \
            > "$RUNNER_TEMP/omics-private-cli.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "OMICS_ACQUISITION=FAILED job_id=$COSCI_JOB_ID"
            exit "$rc"
          fi
          echo "OMICS_ACQUISITION=PASS job_id=$COSCI_JOB_ID"

      - name: Validate public receipt contains no private omics details
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_executor.public_status import validate_public_status

          p = Path("out/omics-status.json")
          status = json.loads(p.read_text(encoding="utf-8"))
          validate_public_status(status)

          forbidden = {
              "research_question", "hypothesis", "private_manifest", "payload",
              "drive_destinations", "source_url", "sources", "selected_accession",
              "accession", "accession_candidates", "fastq", "fastq_ftp", "fastq_md5",
              "sample_accession", "run_accession", "study_accession", "experiment_accession",
              "api_key", "refresh_token", "credential_value", "drive_file_id"
          }

          def keys(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      yield str(key).lower()
                      yield from keys(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from keys(child)

          leaked = sorted(forbidden.intersection(set(keys(status))))
          if leaked:
              raise SystemExit(f"private omics fields leaked to public artifact: {leaked}")
          print("PUBLIC_EXECUTOR_SAFE omics receipt validation PASS")
          PY

      - name: Upload public-safe omics receipt
        uses: actions/upload-artifact@v4
        with:
          name: research-omics-status-${{ env.COSCI_JOB_ID }}
          path: out/omics-status.json
          if-no-files-found: error
          retention-days: 7
