name: Research Executor Completion-First Review Smoke

on:
  push:
    paths:
      - "research_executor/adversarial.py"
      - "research_executor/public_status.py"
      - "research_executor/tests/test_adversarial.py"
      - ".github/workflows/research-executor-adversarial-smoke.yml"
  workflow_dispatch:
    inputs:
      cycle1_job_id:
        required: true
        default: "COSCI-S10-CYCLE1-001"
      cycle2_job_id:
        required: true
        default: "COSCI-S10-CYCLE2-001"

jobs:
  adversarial-smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zero-cost regression dependencies
        run: python -m pip install --disable-pip-version-check pytest python-docx==1.2.0 reportlab==5.0.1 Pillow==12.3.0
      - name: Run full executor tests including completion-first policy
        run: python -m pytest research_executor/tests -q
      - name: Cycle 1 - repair and review once more
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          python -m research_executor.adversarial --job-id "${{ inputs.cycle1_job_id || 'COSCI-S10-CYCLE1-001' }}" --public-status out/cycle1.json
      - name: Cycle 2 - proceed with limitations
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          python -m research_executor.adversarial --job-id "${{ inputs.cycle2_job_id || 'COSCI-S10-CYCLE2-001' }}" --public-status out/cycle2.json
      - name: Public privacy check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for fn in ("out/cycle1.json", "out/cycle2.json"):
              p=json.loads(Path(fn).read_text())
              assert p["privacy_class"]=="PUBLIC_EXECUTOR_SAFE"
              assert p["task_type"]=="ADVERSARIAL_REVIEW"
              text=json.dumps(p).lower()
              for forbidden in ("finding_id","issue_ledger","evidence","rationale","drive_file_id"):
                  assert forbidden not in text
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-completion-review-status-${{ github.run_id }}
          path: out/*.json
