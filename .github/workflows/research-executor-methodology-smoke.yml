name: Research CoScientist Methodology Skills Smoke

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Opaque Research CoScientist methodology job ID only"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "research_executor/methodology.py"
      - "research_executor/methodology_registry.json"
      - "research_executor/tests/test_methodology.py"
      - "research_executor/public_status.py"
      - "research_executor/public-status.schema.json"
      - ".github/workflows/research-executor-methodology-smoke.yml"

permissions:
  contents: read

concurrency:
  group: research-methodology-${{ github.event_name == 'workflow_dispatch' && inputs.job_id || 'COSCI-S08-METHOD-001' }}
  cancel-in-progress: false

jobs:
  methodology-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COSCI_JOB_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.job_id || 'COSCI-S08-METHOD-001' }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Checkout public executor
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full executor tests including methodology orchestration
        run: >-
          python -m unittest
          research_executor.tests.test_executor
          research_executor.tests.test_drive_bridge
          research_executor.tests.test_acquisition
          research_executor.tests.test_omics
          research_executor.tests.test_analysis
          research_executor.tests.test_literature
          research_executor.tests.test_methodology
          -v

      - name: Install pinned ToolUniverse discovery runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "tooluniverse==1.4.1"
          python - <<'PY'
          import importlib.metadata
          version = importlib.metadata.version("tooluniverse")
          if version != "1.4.1":
              raise SystemExit(f"unexpected ToolUniverse version: {version}")
          print(f"TOOLUNIVERSE_VERSION={version}")
          PY

      - name: Live-smoke ToolUniverse registry discovery adapter
        run: |
          python - <<'PY'
          from tooluniverse import ToolUniverse
          from research_executor.methodology import rank_tool_names

          tu = ToolUniverse()
          tu.load_tools()
          names = tu.list_built_in_tools(mode="list_name")
          if not isinstance(names, list) or len(names) < 700:
              raise SystemExit(f"ToolUniverse registry unexpectedly small: {len(names) if isinstance(names, list) else 'not-list'}")
          ranked = rank_tool_names([str(x) for x in names], ["pubmed", "literature"], limit=10)
          if not ranked:
              raise SystemExit("ToolUniverse adapter could not discover a literature-related tool")
          print(f"TOOLUNIVERSE_REGISTRY=PASS count={len(names)}")
          print(f"TOOLUNIVERSE_DISCOVERY_ADAPTER=PASS top={ranked[0]['name']}")
          PY

      - name: Execute private Drive methodology skill-planning job
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          set +e
          python -m research_executor.methodology \
            --job-id "$COSCI_JOB_ID" \
            --public-status out/methodology-status.json \
            > "$RUNNER_TEMP/methodology-private-cli.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "METHODOLOGY_SKILLS=FAILED job_id=$COSCI_JOB_ID"
            tail -n 40 "$RUNNER_TEMP/methodology-private-cli.log"
            exit "$rc"
          fi
          echo "METHODOLOGY_SKILLS=PASS job_id=$COSCI_JOB_ID"

      - name: Validate public receipt contains no private methodology details
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_executor.public_status import validate_public_status

          p = Path("out/methodology-status.json")
          status = json.loads(p.read_text(encoding="utf-8"))
          validate_public_status(status)
          forbidden = {
              "research_direction", "research_question", "hypothesis", "private_manifest",
              "parameters", "methodology_plan", "skill_plan", "tool_discovery_plan",
              "reproducibility_contract", "handoffs", "preregistration", "approval_decision",
              "drive_file_id", "api_key", "refresh_token", "credential_value"
          }
          def keys(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      yield str(key).lower()
                      yield from keys(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from keys(child)
          leaked = sorted(forbidden.intersection(set(keys(status))))
          if leaked:
              raise SystemExit(f"private methodology fields leaked to public artifact: {leaked}")
          print("PUBLIC_EXECUTOR_SAFE methodology receipt validation PASS")
          PY

      - name: Upload public-safe methodology receipt
        uses: actions/upload-artifact@v4
        with:
          name: research-methodology-status-${{ env.COSCI_JOB_ID }}
          path: out/methodology-status.json
          if-no-files-found: error
          retention-days: 7
