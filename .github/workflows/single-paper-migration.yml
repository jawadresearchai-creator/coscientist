name: single-paper-v4.3-migration

on:
  push:
    branches:
      - single-paper-v4.3

permissions:
  contents: write

concurrency:
  group: single-paper-v4.3-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: single-paper-v4.3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install current engine and test dependencies
        run: pip install -e '.[dev]'

      - name: Apply single-paper migration
        run: python tools/apply_single_paper_migration.py

      - name: Run full test suite
        run: pytest -q

      - name: Commit validated v4.3 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet && {
            echo '::error::Migration produced no changes'
            exit 1
          }
          git commit -m 'feat: adopt single-paper operating model v4.3.0'
          git push origin HEAD:single-paper-v4.3
