# Single-paper deterministic heartbeat.
#
# The cycle owns no scientific judgment and never runs a candidate tournament.
# It refreshes the lake view, reconciles the one canonical paper plus Director
# state from Drive, applies at most one matching reasoning-plane answer, and
# persists exactly one next research action.

name: cycle

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  # Bootstrap a newly released Director immediately. Heartbeat-only pushes do
  # not match these paths, so the bot cannot recursively trigger itself.
  push:
    branches: [main]
    paths:
      - "src/coscientist/director.py"
      - "src/coscientist/director_drive.py"
      - ".github/workflows/cycle.yml
      - "policy.yaml"

permissions:
  contents: write

concurrency:
  group: coscientist-single-paper-cycle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Refresh GMS lake catalog
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GMSDL_MANIFEST_FOLDER_ID: ${{ secrets.GMSDL_MANIFEST_FOLDER_ID }}
          GMSDL_GITHUB_REPO: ${{ vars.GMSDL_GITHUB_REPO }}
          GMSDL_GITHUB_TOKEN: ${{ secrets.GMSDL_GITHUB_TOKEN }}
        run: |
          coscientist lake-sync --out state/gms_lake_catalog.json
          coscientist lake-doctor --catalog state/gms_lake_catalog.json

      - name: Pull canonical single-paper state
        id: paper_pull
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_STATE_FOLDER_ID: ${{ secrets.GDRIVE_STATE_FOLDER_ID }}
        run: |
          python -m coscientist.single_paper_drive pull \
            --state state/single_paper.json \
            --folder "$GDRIVE_STATE_FOLDER_ID"

      - name: Pull canonical Research Director state
        id: director_pull
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_STATE_FOLDER_ID: ${{ secrets.GDRIVE_STATE_FOLDER_ID }}
        run: |
          python -m coscientist.director_drive pull \
            --state state/director.json \
            --folder "$GDRIVE_STATE_FOLDER_ID"

      - name: Pull reasoning-plane answer inbox
        id: answer_pull
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_STATE_FOLDER_ID: ${{ secrets.GDRIVE_STATE_FOLDER_ID }}
        run: |
          python -m coscientist.director_drive pull-answer \
            --answer state/director_answer.json \
            --folder "$GDRIVE_STATE_FOLDER_ID"

      - name: Apply matching Director answer if present
        id: director_apply
        run: |
          python -m coscientist.director \
            --state state/single_paper.json \
            --director state/director.json \
            --catalog state/gms_lake_catalog.json \
            apply-if-present --answer state/director_answer.json

      - name: Run the deterministic stages (Research Director)
        id: director_ensure
        run: |
          python -m coscientist.director \
            --state state/single_paper.json \
            --director state/director.json \
            --catalog state/gms_lake_catalog.json \
            ensure --action-out state/director_action.json
          echo
          python -m coscientist.director \
            --state state/single_paper.json \
            --director state/director.json \
            --catalog state/gms_lake_catalog.json \
            status

      - name: Persist canonical paper and Director state to Drive
        if: >-
          always() &&
          steps.paper_pull.outcome == 'success' &&
          steps.director_pull.outcome == 'success' &&
          steps.answer_pull.outcome == 'success' &&
          steps.director_apply.outcome == 'success' &&
          steps.director_ensure.outcome == 'success'
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_STATE_FOLDER_ID: ${{ secrets.GDRIVE_STATE_FOLDER_ID }}
        run: |
          python -m coscientist.single_paper_drive push \
            --state state/single_paper.json \
            --folder "$GDRIVE_STATE_FOLDER_ID"
          python -m coscientist.director_drive push \
            --state state/director.json \
            --folder "$GDRIVE_STATE_FOLDER_ID"

      # Research state, designs, data, results and manuscripts remain Drive-only.
      # Git receives only operational heartbeat/budget accounting.
      - name: Persist operational heartbeat
        run: |
          git config user.name  "coscientist-bot"
          git config user.email "${{ secrets.CONTACT_EMAIL }}"
          git add -f state/budget.json state/heartbeat.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "cycle: heartbeat $(date -u +%FT%TZ)"
          git push || echo "nothing to push"
