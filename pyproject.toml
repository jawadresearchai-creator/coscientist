[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coscientist"
dynamic = ["version"]
description = "CoScientist V4 deterministic core -- runs with no LLM and no subscription"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.0"]
dev = ["pytest>=7.4"]
analysis = [
  "pyarrow>=16.0",
  "polars>=1.0",
  "duckdb>=1.0",
  "statsmodels>=0.14",
  "linearmodels>=6.0",
  "pyfixest>=0.30",
  "scikit-learn>=1.5",
  "doubleml>=0.9",
  "dowhy>=0.12",
  "econml>=0.16",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "rdrobust>=1.3",
  "arch>=7.0",
  "lifelines>=0.30",
  "cvxpy>=1.6",
  "networkx>=3.3",
  "cmdstanpy>=1.2",
  "pymc>=5.18",
  "arviz>=0.20",
  "matplotlib>=3.9",
  "plotnine>=0.14",
]

[project.scripts]
coscientist = "coscientist.cli:main"

[tool.setuptools.dynamic]
version = {attr = "coscientist.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
