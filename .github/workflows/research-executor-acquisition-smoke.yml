name: Research CoScientist Acquisition Broker Smoke

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Opaque private Drive DATA_ACQUISITION job ID only"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "research_executor/acquisition.py"
      - "research_executor/source_registry.json"
      - "research_executor/public_status.py"
      - "research_executor/tests/test_acquisition.py"
      - ".github/workflows/research-executor-acquisition-smoke.yml"

permissions:
  contents: read

concurrency:
  group: research-acquisition-${{ github.event_name == 'workflow_dispatch' && inputs.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  acquisition-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      COSCI_JOB_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.job_id || 'COSCI-S04-HTTP-001 COSCI-S04-JSON-001' }}
    steps:
      - name: Checkout public executor
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run executor acquisition tests
        run: >-
          python -m unittest
          research_executor.tests.test_executor
          research_executor.tests.test_drive_bridge
          research_executor.tests.test_acquisition
          -v

      - name: Execute private Drive acquisition jobs
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          for JOB_ID in $COSCI_JOB_IDS; do
            python -m research_executor.acquisition \
              --job-id "$JOB_ID" \
              --public-status "out/${JOB_ID}.json"
          done

      - name: Validate public receipts contain no private source details
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_executor.public_status import validate_public_status

          forbidden = {
              "research_question", "hypothesis", "private_manifest", "payload",
              "drive_destinations", "source_url", "sources", "api_key",
              "refresh_token", "credential_value"
          }

          def keys(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      yield str(key).lower()
                      yield from keys(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from keys(child)

          receipts = list(Path("out").glob("COSCI-S04-*.json"))
          if not receipts:
              raise SystemExit("no acquisition public receipts produced")
          for path in receipts:
              status = json.loads(path.read_text(encoding="utf-8"))
              validate_public_status(status)
              leaked = sorted(forbidden.intersection(set(keys(status))))
              if leaked:
                  raise SystemExit(f"private fields leaked in {path.name}: {leaked}")
          print(f"PUBLIC_EXECUTOR_SAFE acquisition receipts PASS: {len(receipts)}")
          PY

      - name: Upload public-safe acquisition receipts
        uses: actions/upload-artifact@v4
        with:
          name: research-acquisition-status-${{ github.run_id }}
          path: out/COSCI-S04-*.json
          if-no-files-found: error
          retention-days: 7
