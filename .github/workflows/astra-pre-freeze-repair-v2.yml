name: Astra Pre-Freeze Repair V2

on:
  push:
    branches:
      - astra-data-v3-repair-v3
    paths:
      - "src/coscientist/astra_design_repair.py"
      - "scripts/repair_astra_pre_freeze_v2.py"
      - "scripts/run_astra_pre_freeze_repair_v2_hardened.py"
      - "tests/test_astra_design_repair.py"
      - "README.md"
      - ".github/workflows/astra-pre-freeze-repair-v2.yml"
      - "ops/astra_pre_freeze_repair_v2.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-pre-freeze-repair-v2
  cancel-in-progress: false

jobs:
  test-pre-freeze-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]" pyarrow
      - name: Compile repair builder and hardened launcher
        run: python -m py_compile scripts/repair_astra_pre_freeze_v2.py scripts/run_astra_pre_freeze_repair_v2_hardened.py
      - name: Run repair and integrity gates
        run: pytest tests/test_astra_design_repair.py tests/test_integrity.py -v

  build-publish-repair:
    needs: test-pre-freeze-repair
    if: ${{ contains(github.event.head_commit.message, '[repair-astra-pre-freeze-v2]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install -e ".[dev]" pyarrow
      - name: Repair and publish outcome-blind design V2
        run: python scripts/run_astra_pre_freeze_repair_v2_hardened.py
