name: Research CoScientist Executor Smoke

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Opaque Research CoScientist job ID (no private research content)"
        required: true
        type: string
      task_type:
        description: "Public executor task selector"
        required: true
        default: SMOKE_TEST
        type: choice
        options:
          - SMOKE_TEST
  push:
    branches:
      - main
    paths:
      - "research_executor/**"
      - ".github/workflows/research-executor-smoke.yml"

permissions:
  contents: read

concurrency:
  group: research-executor-smoke-${{ github.event_name == 'workflow_dispatch' && inputs.job_id || github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COSCI_JOB_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.job_id || format('COSCI-SMOKE-{0}', github.run_id) }}
      COSCI_TASK_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.task_type || 'SMOKE_TEST' }}
    steps:
      - name: Checkout public executor
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run executor unit tests
        run: python -m unittest discover -s research_executor/tests -v

      - name: Validate privacy-safe dispatch
        run: >-
          python -m research_executor.validate_dispatch
          --job-id "$COSCI_JOB_ID"
          --task-type "$COSCI_TASK_TYPE"

      - name: Execute deterministic smoke task
        run: >-
          python -m research_executor.router
          --job-id "$COSCI_JOB_ID"
          --task-type "$COSCI_TASK_TYPE"
          --output out/status.json

      - name: Display sanitized status
        run: cat out/status.json

      - name: Upload public-safe smoke receipt
        uses: actions/upload-artifact@v4
        with:
          name: research-executor-status-${{ env.COSCI_JOB_ID }}
          path: out/status.json
          if-no-files-found: error
          retention-days: 7
