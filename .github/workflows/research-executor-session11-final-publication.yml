name: Research CoScientist Session 11 Final Publication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-executor-session11-final-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COSCI_JOB_ID: COSCI-S11-PUB-FINAL3-001
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned publication renderers
        run: >-
          python -m pip install --disable-pip-version-check --quiet
          "python-docx==1.2.0" "reportlab==5.0.1" "Pillow==12.3.0"
      - name: Run publication regression tests
        run: python -m unittest research_executor.tests.test_publication -v
      - name: Execute repaired final publication job
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          python -m research_executor.publication --job-id "$COSCI_JOB_ID" --public-status out/publication-status.json > "$RUNNER_TEMP/publication.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/publication.log"; exit 1; }
          echo "SESSION11_FINAL_PUBLICATION=PASS"
      - name: Validate public-safe receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_executor.public_status import validate_public_status
          status=json.loads(Path('out/publication-status.json').read_text())
          validate_public_status(status)
          assert status['privacy_class']=='PUBLIC_EXECUTOR_SAFE'
          print('SESSION11_FINAL_PUBLICATION_RECEIPT=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-session11-final-publication-status
          path: out/publication-status.json
          retention-days: 7
