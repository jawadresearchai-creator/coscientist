[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coscientist"
dynamic = ["version"]
description = "CoScientist V4 deterministic core -- runs with no LLM and no subscription"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "lxml>=5.0"]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.0"]
dev = ["pytest>=7.4"]

[project.scripts]
coscientist = "coscientist.cli:main"

[tool.setuptools.dynamic]
version = {attr = "coscientist.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
