name: Astra Analysis-Ready V3 Repair

on:
  push:
    branches:
      - astra-data-v3-repair-v3
    paths:
      - "src/coscientist/astra_v3.py"
      - "src/coscientist/eventstudy_price_metrics.py"
      - "src/coscientist/eventstudy_fact_selection.py"
      - "src/coscientist/eventstudy_controls.py"
      - "src/coscientist/eventstudy_io.py"
      - "scripts/build_astra_analysis_ready_v3.py"
      - "scripts/run_astra_v3_hardened.py"
      - "scripts/run_astra_v3_literal_safe.py"
      - "tests/test_astra_v3.py"
      - "tests/test_eventstudy_fact_selection.py"
      - "tests/test_eventstudy_io.py"
      - "README.md"
      - ".github/workflows/astra-analysis-ready-v3.yml"
      - "ops/astra_v3_launch.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-analysis-ready-v3-repair
  cancel-in-progress: false

jobs:
  test-v3-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]" pyarrow
      - name: Compile V3 execution wrappers
        run: python -m py_compile scripts/run_astra_v3_hardened.py scripts/run_astra_v3_literal_safe.py
      - name: Run V3 repair tests and repository integrity tests
        run: >-
          pytest
          tests/test_astra_v3.py
          tests/test_eventstudy_fact_selection.py
          tests/test_eventstudy_io.py
          tests/test_integrity.py
          -v

  build-and-publish-v3:
    needs: test-v3-repair
    if: ${{ contains(github.event.head_commit.message, '[launch-astra-v3]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install -e ".[dev]" pyarrow
      - name: Build and publish immutable outcome-blind V3
        run: python scripts/run_astra_v3_literal_safe.py
