# Backward-compatibility guarantees for the paper-local lifecycle engine.
# V4.7.0 permits multiple papers globally. These historical IDs remain stable
# because documentation and integrity receipts may reference them; their scope
# is now explicitly one paper-state file rather than the whole CoScientist.

guarantees:
  - id: SINGLE_ACTIVE_PAPER_ONLY
    claim: One paper-state file contains only one active charter; additional active papers use separate paper-state files in the multi-paper registry.
    test: test_cannot_admit_second_active_paper

  - id: DISCOVERY_STOPS_AFTER_ADMISSION
    claim: Within one paper-state file, a second charter cannot replace the current charter while that paper is active; this does not block discovery or admission of other registered papers.
    test: test_discovery_is_locked_while_paper_is_active

  - id: RETIREMENT_REQUIRES_GENUINE_BLOCKER
    claim: Operational problems cannot retire a paper; retirement requires an enumerated genuine blocker.
    test: test_operational_problem_cannot_retire_active_paper

  - id: TERMINAL_PAPER_REOPENS_DISCOVERY
    claim: The legacy paper-local state file may accept a replacement charter only after its current charter is terminal; multi-paper mode normally creates a separate paper state instead.
    test: test_submission_ready_reopens_discovery

  - id: TOPIC_EVOLUTION_HAS_NO_ARBITRARY_BUDGET
    claim: Pre-freeze evolution of a paper is not terminated by an arbitrary rescope-count budget.
    test: test_pre_freeze_evolution_is_not_arbitrarily_bounded

  - id: HISTORICAL_CANDIDATES_ARE_NOT_ACTIVE_INPUT
    claim: Historical retired-candidate and recycle memory does not reject or seed a paper.
    test: test_legacy_candidate_memory_is_ignored

  - id: LEGACY_STATE_FIELDS_ARE_NOT_IMPORTED
    claim: Legacy slate, portfolio, and retired-lineage fields are ignored when a paper-local state is loaded.
    test: test_legacy_fields_are_ignored_when_loading

  - id: G3_IS_LAKE_FIRST
    claim: A suitable exact lake holding is selected before any external source is probed.
    test: test_g3_uses_lake_before_external_source

  - id: SINGLE_PAPER_STAGE_IS_MONOTONIC
    claim: Each paper independently cannot skip lifecycle stages or move backwards through them.
    test: test_stage_cannot_skip_or_move_backwards

  - id: PRE_FREEZE_EVOLUTION_STOPS_AT_FREEZE
    claim: Topic evolution is permitted repeatedly before that paper's freeze and refused after its outcome lock.
    test: test_evolution_is_pre_freeze_and_not_capped
