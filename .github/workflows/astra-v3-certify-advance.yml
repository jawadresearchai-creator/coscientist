name: Astra V3 Certify and Advance

on:
  push:
    branches:
      - astra-data-v3-repair-v3
    paths:
      - "scripts/certify_and_advance_astra_v3.py"
      - ".github/workflows/astra-v3-certify-advance.yml"
      - "ops/astra_v3_advance.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-v3-certify-advance
  cancel-in-progress: false

jobs:
  certify-and-advance:
    if: ${{ contains(github.event.head_commit.message, '[advance-astra-v3]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install -e ".[dev]" pyarrow
      - name: Compile certification transition
        run: python -m py_compile scripts/certify_and_advance_astra_v3.py
      - name: Certify immutable V3 and advance Director
        run: python scripts/certify_and_advance_astra_v3.py
