# Reproducible confirmatory analysis — v4.6.
#
# Chain: immutable Drive state -> exact locked Git commit -> AnalysisLock verify
# -> frozen datasets -> analysis -> sealed streams -> ResultsBridge -> optional
# manuscript-number provenance -> verified Drive publication -> analysis receipt.

name: analysis

on:
  workflow_dispatch:
    inputs:
      study:
        description: Active CoScientist paper identifier
        required: true
      git_sha:
        description: Exact Git commit whose analysis code was locked
        required: true
      strict_provenance:
        description: Keep confirmatory result publication separate from exploratory development
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: coscientist-analysis-${{ github.event.inputs.study || 'default' }}
  cancel-in-progress: false

env:
  COSCIENTIST_FREEZE: state/freeze.json
  COSCIENTIST_DATA_DIR: data
  COSCIENTIST_RESULTS_DIR: results/streams
  COSCIENTIST_FIGURE_DIR: results/figures

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # The analysis executes the exact commit that existed when the Director
      # created the AnalysisLock. A later main-branch change cannot silently
      # change the engine or study scripts underneath a frozen design.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_sha }}

      - name: Verify locked Git commit
        run: |
          ACTUAL=$(git rev-parse HEAD)
          test "$ACTUAL" = "${{ github.event.inputs.git_sha }}" || {
            echo "::error::checkout $ACTUAL differs from locked commit ${{ github.event.inputs.git_sha }}"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine
        run: pip install -e ".[dev]"

      - name: Bootstrap immutable study state from Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_STATE_FOLDER_ID: ${{ secrets.GDRIVE_STATE_FOLDER_ID }}
        run: |
          coscientist state-fetch \
            --study "${{ github.event.inputs.study }}" \
            --dest state --folder "$GDRIVE_STATE_FOLDER_ID"

      - name: Verify analysis lock before outcome access
        run: |
          coscientist analysis-verify \
            --lock state/analysis_lock.json \
            --freeze state/freeze.json --root .

      - name: Require the R lock
        run: |
          test -f renv.lock || {
            echo "::error::renv.lock is missing"
            exit 1
          }

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ hashFiles('renv.lock') }}

      - name: Refresh GMS lake catalog from control manifests
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GMSDL_MANIFEST_FOLDER_ID: ${{ secrets.GMSDL_MANIFEST_FOLDER_ID }}
          GMSDL_GITHUB_REPO: ${{ vars.GMSDL_GITHUB_REPO }}
          GMSDL_GITHUB_TOKEN: ${{ secrets.GMSDL_GITHUB_TOKEN }}
        run: |
          coscientist lake-sync --out state/gms_lake_catalog.json
          coscientist lake-doctor --catalog state/gms_lake_catalog.json

      - name: Fetch only frozen GMS objects
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GMSDL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GMSDL_DRIVE_ROOT_FOLDER_ID }}
        run: |
          coscientist gms-fetch --manifest state/freeze.json \
            --catalog state/gms_lake_catalog.json --dest data

      - name: Verify frozen datasets
        run: coscientist freeze-verify --manifest state/freeze.json --data-dir data

      - name: Run locked analysis plan
        run: |
          set -euo pipefail
          coscientist plan --root . > /tmp/plan.txt
          test -s /tmp/plan.txt || { echo "::error::analysis plan is empty"; exit 1; }
          while read -r s; do
            echo "::group::$s"
            case "$s" in
              *.R)  COSCIENTIST_CURRENT_SCRIPT="$s" Rscript "$s" ;;
              *.py) COSCIENTIST_CURRENT_SCRIPT="$s" python "$s" ;;
              *)    echo "::error::no runner for $s"; exit 1 ;;
            esac
            echo "::endgroup::"
          done < /tmp/plan.txt

      - name: Assemble verified ResultsBridge
        run: |
          coscientist collect \
            --streams results/streams \
            --out results/manuscript \
            --manifest state/freeze.json \
            --lock state/analysis_lock.json \
            --root .
          test -f results/manuscript/ANALYSIS_MANIFEST.json

      # Manuscript numeric provenance is a later final-audit receipt when the
      # manuscript exists. If an already-drafted manuscript is present here,
      # validate it too; absence is not represented as a false PASS.
      - name: Check manuscript numeric provenance when manuscript exists
        run: |
          if [ -f reports/manuscript.md ]; then
            STRICT=""
            if [ "${{ github.event.inputs.strict_provenance }}" != "false" ]; then
              STRICT="--require-tokens"
            fi
            coscientist provenance reports/manuscript.md $STRICT \
              --results results/manuscript/ANALYSIS_MANIFEST.json \
              --freeze state/freeze.json
            echo "MANUSCRIPT_PROVENANCE=PASS" >> "$GITHUB_ENV"
          else
            echo "MANUSCRIPT_PROVENANCE=NOT_APPLICABLE" >> "$GITHUB_ENV"
          fi

      - name: Publish verified confirmatory results to Drive
        if: success() && github.event.inputs.strict_provenance != 'false'
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_RESULTS_FOLDER_ID: ${{ secrets.GDRIVE_RESULTS_FOLDER_ID }}
        run: |
          coscientist publish --dir results --folder "$GDRIVE_RESULTS_FOLDER_ID" \
            --study "${{ github.event.inputs.study }}" \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --mode confirmatory

      - name: Create and persist canonical analysis receipt
        if: success() && github.event.inputs.strict_provenance != 'false'
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_STATE_FOLDER_ID: ${{ secrets.GDRIVE_STATE_FOLDER_ID }}
        run: |
          python -m coscientist.integrity_cli analysis \
            --paper "${{ github.event.inputs.study }}" \
            --freeze state/freeze.json \
            --analysis-lock state/analysis_lock.json \
            --results results/manuscript/ANALYSIS_MANIFEST.json \
            --git-sha "${{ github.event.inputs.git_sha }}" \
            --workflow-run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --provenance-status PASS --publication-status PASS \
            --out state/analysis_receipt.json
          python -m coscientist.study_state_drive push \
            --study "${{ github.event.inputs.study }}" \
            --root-folder "$GDRIVE_STATE_FOLDER_ID" \
            --name analysis_receipt.json --path state/analysis_receipt.json

      - name: Publish exploratory development results to Drive
        if: success() && github.event.inputs.strict_provenance == 'false'
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_DEVELOPMENT_RESULTS_FOLDER_ID: ${{ secrets.GDRIVE_DEVELOPMENT_RESULTS_FOLDER_ID }}
        run: |
          coscientist publish --dir results --folder "$GDRIVE_DEVELOPMENT_RESULTS_FOLDER_ID" \
            --study "${{ github.event.inputs.study }}" \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --mode exploratory

      - name: Upload diagnostics from failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FAILED-RUN-${{ github.event.inputs.study || 'run' }}-${{ github.run_id }}
          path: |
            results/
            !results/**/*.rds
          retention-days: 14

      - name: Upload verified run artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ github.event.inputs.study || 'run' }}
          path: |
            results/
            !results/**/*.rds
            state/analysis_receipt.json
          retention-days: 14

      - name: Shred fetched data
        if: always()
        run: rm -rf data
