name: Research CoScientist Publication Engine Smoke

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Opaque Research CoScientist publication job ID only"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "research_executor/publication.py"
      - "research_executor/publication_registry.json"
      - "research_executor/tests/test_publication.py"
      - "research_executor/public_status.py"
      - "research_executor/public-status.schema.json"
      - ".github/workflows/research-executor-publication-smoke.yml"

permissions:
  contents: read

concurrency:
  group: research-publication-${{ github.event_name == 'workflow_dispatch' && inputs.job_id || 'COSCI-S09-PUB-001' }}
  cancel-in-progress: false

jobs:
  publication-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COSCI_JOB_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.job_id || 'COSCI-S09-PUB-001' }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Checkout public executor
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned zero-cost publication renderers
        run: >-
          python -m pip install --disable-pip-version-check --quiet
          "python-docx==1.2.0"
          "reportlab==5.0.1"
          "Pillow==12.3.0"

      - name: Run full executor tests including publication engine
        run: >-
          python -m unittest
          research_executor.tests.test_executor
          research_executor.tests.test_drive_bridge
          research_executor.tests.test_acquisition
          research_executor.tests.test_omics
          research_executor.tests.test_analysis
          research_executor.tests.test_literature
          research_executor.tests.test_methodology
          research_executor.tests.test_publication
          -v

      - name: Live-smoke official journal guidance and DOI verification
        run: |
          python - <<'PY'
          from research_executor.publication import retrieve_journal_requirements, verify_doi

          requirements = retrieve_journal_requirements({
              "journal_key": "PUBLIC_ACCEPTANCE_PROBE",
              "official_url": "https://journals.plos.org/plosone/s/submission-guidelines",
              "required_markers": ["PLOS ONE", "Submission Guidelines", "Figures", "Tables", "References"],
          })
          if requirements["marker_validation"] != "PASS":
              raise SystemExit("official journal guidance marker validation failed")
          print("OFFICIAL_JOURNAL_REQUIREMENTS=PASS")
          citation = verify_doi("10.1016/j.pbi.2014.04.009")
          if citation["status"] != "PASS":
              raise SystemExit("keyless DOI verification failed")
          print("CROSSREF_DOI_VERIFICATION=PASS")
          PY

      - name: Execute private Drive publication job
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          set +e
          python -m research_executor.publication \
            --job-id "$COSCI_JOB_ID" \
            --public-status out/publication-status.json \
            > "$RUNNER_TEMP/publication-private-cli.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "PUBLICATION_ENGINE=FAILED job_id=$COSCI_JOB_ID"
            tail -n 40 "$RUNNER_TEMP/publication-private-cli.log"
            exit "$rc"
          fi
          echo "PUBLICATION_ENGINE=PASS job_id=$COSCI_JOB_ID"

      - name: Validate public receipt contains no private publication details
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_executor.public_status import validate_public_status

          p = Path("out/publication-status.json")
          status = json.loads(p.read_text(encoding="utf-8"))
          validate_public_status(status)
          forbidden = {
              "research_question", "research_direction", "hypothesis", "manuscript", "private_manifest",
              "parameters", "journal", "journal_requirements", "canonical_manuscript", "manuscript_source",
              "citation_ledger", "figure_table_registry", "build_manifest", "authors", "author",
              "title", "abstract", "doi", "drive_file_id", "source_url", "api_key", "refresh_token",
              "credential_value", "figure", "table", "source_artifacts"
          }
          def keys(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      yield str(key).lower()
                      yield from keys(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from keys(child)
          leaked = sorted(forbidden.intersection(set(keys(status))))
          if leaked:
              raise SystemExit(f"private publication fields leaked to public artifact: {leaked}")
          print("PUBLIC_EXECUTOR_SAFE publication receipt validation PASS")
          PY

      - name: Upload public-safe publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: research-publication-status-${{ env.COSCI_JOB_ID }}
          path: out/publication-status.json
          if-no-files-found: error
          retention-days: 7
